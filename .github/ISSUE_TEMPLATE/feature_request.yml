name: Feature request
description: Suggest an idea for BuildPilot
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that BuildPilot doesn't support today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: checkboxes
    id: roadmap-check
    attributes:
      label: Roadmap check
      options:
        - label: I checked docs/ROADMAP.md and this isn't already tracked there
