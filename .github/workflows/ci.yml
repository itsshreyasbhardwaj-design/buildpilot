name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Typecheck SDK
        run: pnpm --filter @buildpilot/sdk typecheck
      - name: Build SDK
        # mcp-server imports @buildpilot/sdk's compiled output (package.json
        # main/types point at dist/), so it must be built before mcp-server
        # can typecheck, not just have its own source typecheck cleanly.
        run: pnpm --filter @buildpilot/sdk build
      - name: Typecheck MCP server
        run: pnpm --filter @buildpilot/mcp-server typecheck

  unit-and-integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
        env:
          DATABASE_URL: file:./prisma/dev.db
      - run: pnpm build
        env:
          DATABASE_URL: file:./prisma/dev.db
      - name: Build SDK
        run: pnpm --filter @buildpilot/sdk build
      - name: Build MCP server
        run: pnpm --filter @buildpilot/mcp-server build

  e2e:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # pretest:e2e (migrate/seed/build against prisma/e2e.db) runs
      # automatically as pnpm's pre-hook for test:e2e — do not also run it
      # explicitly here, or seeding runs twice against the same database.
      - run: pnpm test:e2e

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm benchmark

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # High/critical only — don't fail CI on every low-severity transitive
      # advisory, but never silently ignore anything serious.
      - run: pnpm audit --audit-level=high
